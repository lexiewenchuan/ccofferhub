services:
  - type: web
    name: ccofferhub
    runtime: python
    plan: free
    rootDir: .
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
